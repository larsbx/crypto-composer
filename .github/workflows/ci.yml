name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO(v0.2+): pin Zig version to the project's declared minimum.
      # If you bump Zig, update this version and re-run `make manifest`.
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run CI (fmt-check, test, manifest verify)
        shell: bash
        run: |
          make ci

  manifest-regressions:
    name: Manifest tests (isolated from Zig toolchain)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed source hashes
        shell: bash
        run: python3 scripts/verify_manifest.py
      - name: Run Git-blob and tampering regression fixtures
        shell: bash
        run: python3 -m unittest discover -s test -p 'test_manifest_regression.py' -v
