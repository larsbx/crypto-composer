name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Zig is pinned to the repository's declared toolchain. Keep this value,
      # README.md, AGENTS.md, and MANIFEST.SHA256 in sync.
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run CI (fmt-check, test, manifest verify)
        shell: bash
        run: |
          make ci
